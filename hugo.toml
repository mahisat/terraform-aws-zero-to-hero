# GitHub Pages project site (CI also passes --baseURL from configure-pages).
baseURL = 'https://mahisat.github.io/terraform-aws-zero-to-hero/'
relativeURLs = false
canonifyURLs = true
title = 'Zero to Hero Terraform AWS'
theme = 'PaperMod'

[pagination]
  pagerSize = 10

[params]
  env = 'production'
  description = 'Learn Terraform, VPC, EC2, RDS, GitHub Actions, and AWS OIDC by building a three-tier Todo app.'
  defaultTheme = 'auto'
  mainSections = ['posts']
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  [params.homeInfoParams]
    Title = 'Basic & Advanced Three Tier AWS'
    Content = '''
**Basic Three Tier** — read Parts 1–3 in order: **AWS Console**, then **Terraform**, then **GitHub Actions and OIDC**.

**Advanced Three Tier** — Part 1 and beyond (coming soon). Complete the Basic track first, then follow on for production hardening and next-level patterns.
'''

[menu]

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
